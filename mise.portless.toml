# Loaded over mise.toml when MISE_ENV=portless: Django, Vite and Storybook run
# behind the portless proxy on https://*.csplab.localhost (docs/local_https_named_host.md).
# In a git worktree, portless prefixes every host with the branch name.

# a run of its own replaces the dev task of mise.toml; without it, the depends would add to its own
[tasks.dev]
description = "ATS dev stack behind portless: https://csplab.localhost"
depends = ["dev:django", "dev:vite"]
run = "true"

# --force stops the server that already holds the host, e.g. one started by an agent session
[tasks."dev:django"]
hide = true
run = "portless run --name csplab --force mise run web:dev"

[tasks."dev:vite"]
hide = true
run = "portless run --name vite.csplab --force mise run front:dev"

[tasks.sb]
description = "Storybook behind portless: https://storybook.csplab.localhost"
run = "portless run --name storybook.csplab --force mise run storybook --no-open"
