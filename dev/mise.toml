[tasks.install]
alias = "dev:install"
description = "Install the dev tooling Python dependencies (uv sync)"
sources = ["pyproject.toml", "uv.lock"]
outputs = { auto = true }
run = "uv sync --locked"

[tasks."pre-commit"]
alias = "dev:pre-commit"
description = "Run the pre-commit hooks on the whole repo"
depends = ["install"]
run = "uv run pre-commit run --all-files"

[tasks.cz]
alias = "dev:cz"
description = "Commitizen: guided commit, message check"
depends = ["install"]
run = "uv run cz"
