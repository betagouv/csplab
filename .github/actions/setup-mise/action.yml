name: Set up mise
description: Install the mise version required by mise.toml (min_version) with the ci environment, provision the tools declared in mise.toml and cache the pnpm store. Caches are saved on main only, other refs restore them. Requires actions/checkout to have run first.

runs:
  using: composite
  steps:
    - name: Select the ci mise environment
      shell: bash
      run: echo "MISE_ENV=ci" >> "$GITHUB_ENV"
    - name: Read the mise version from mise.toml
      id: mise
      shell: bash
      run: |
        version=$(sed -nE 's/^min_version = "([^"]+)"/\1/p' mise.toml)
        test -n "$version" || { echo "::error::min_version introuvable dans mise.toml"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Install mise and the toolchain
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ steps.mise.outputs.version }}
        cache: true
        cache_save: ${{ github.ref == 'refs/heads/main' }}
    # No uv store cache: shared by every workflow, it held whichever project saved it first and
    # took ~20 s to restore, longer than uv downloading the wheels from PyPI.
    - name: Cache the pnpm store
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: Restore the pnpm store
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
