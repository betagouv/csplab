name: Deploy to Scalingo
description: Push the repository to a deploy branch for Scalingo to deploy. The push is not forced, so an older commit is rejected as non-fast-forward. Requires actions/checkout to have run first.

inputs:
  branch:
    description: Target branch to push to (e.g. main-ocr)
    required: true

runs:
  using: composite
  steps:
    - name: Push to deploy branch
      shell: bash
      run: git push origin HEAD:refs/heads/${{ inputs.branch }}
