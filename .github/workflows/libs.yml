name: Libs

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            relevant:
              - "libs/**"
              - "mise.toml"
              - "mise.ci.toml"
              - "mise.lock"
              - ".github/workflows/libs.yml"
              - ".github/actions/**"

  lint-test-libs:
    needs: check-changes
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-mise
      - name: Install libs dependencies
        run: |
          mise run ddd:install
          mise run referentiel:install
          mise run scaleway-secrets:install
      - name: Lint ddd
        run: mise run ddd:lint
      - name: Lint referentiel
        run: mise run referentiel:lint
      - name: Lint scaleway_secrets
        run: mise run scaleway-secrets:lint
      - name: Test ddd
        run: mise run ddd:test
      - name: Test referentiel
        run: mise run referentiel:test
