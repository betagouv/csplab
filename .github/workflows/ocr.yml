name: OCR

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            relevant:
              - "src/ocr/**"
              - "mise.toml"
              - "mise.ci.toml"
              - ".github/workflows/ocr.yml"
              - ".github/actions/**"

  build-ocr:
    needs: check-changes
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mise
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra
      - name: Install ocr dependencies
        run: mise run ocr:install

  lint-ocr:
    needs: [check-changes, build-ocr]
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mise
      - name: Install ocr dependencies
        run: mise run ocr:install
      - name: Lint with Ruff
        run: mise run ocr:lint:ruff
      - name: Lint with MyPy
        run: mise run ocr:lint:mypy

  test-ocr:
    needs: [check-changes, build-ocr]
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mise
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fra
      - name: Install ocr dependencies
        run: mise run ocr:install
      - name: Test with pytest
        run: mise run ocr:test

  deploy-ocr:
    needs: [check-changes, lint-ocr, test-ocr]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: betagouv
          SENTRY_PROJECT: csplab-ocr
          SENTRY_URL: https://sentry.incubateur.net
        with:
          environment: production
      - uses: ./.github/actions/scalingo-deploy
        with:
          branch: main-ocr
