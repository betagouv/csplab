name: PR Fields Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:

permissions:
  pull-requests: read

jobs:
  check-pr-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR fields
        # GH_TOKEN must be a PAT with read:project scope to query GitHub Projects v2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GH_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            let prNumber;

            if (context.eventName === 'merge_group') {
              // head_ref looks like refs/heads/gh-readonly-queue/main/pr-123-<sha>
              const match = context.payload.merge_group.head_ref.match(/\/pr-(\d+)-/);
              if (!match) {
                core.setFailed(`Could not determine PR number from merge_group head_ref: ${context.payload.merge_group.head_ref}`);
                return;
              }
              prNumber = Number(match[1]);
            } else {
              prNumber = context.payload.pull_request.number;
            }

            const projectItemsFields = `
              nodes {
                project {
                  title
                }
                fieldValues(first: 30) {
                  nodes {
                    ... on ProjectV2ItemFieldSingleSelectValue {
                      name
                      field { ... on ProjectV2FieldCommon { name } }
                    }
                    ... on ProjectV2ItemFieldIterationValue {
                      title
                      field { ... on ProjectV2FieldCommon { name } }
                    }
                    ... on ProjectV2ItemFieldTextValue {
                      text
                      field { ... on ProjectV2FieldCommon { name } }
                    }
                    ... on ProjectV2ItemFieldNumberValue {
                      number
                      field { ... on ProjectV2FieldCommon { name } }
                    }
                  }
                }
              }
            `;

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        number
                        repository { nameWithOwner }
                        projectItems(first: 10) { ${projectItemsFields} }
                      }
                    }
                    projectItems(first: 10) { ${projectItemsFields} }
                  }
                }
              }
            `;

            const requiredFields = ['Importance', 'Size', 'Iteration', 'Epic'];
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            const checkProjectItem = (item, label) => {
              const filledFields = new Set();

              for (const fieldValue of item.fieldValues.nodes) {
                const fieldName = fieldValue.field?.name;
                if (!fieldName) continue;
                const value = fieldValue.name ?? fieldValue.title ?? fieldValue.text ?? fieldValue.number;
                if (value !== null && value !== undefined) {
                  filledFields.add(fieldName);
                }
              }

              const missingFields = requiredFields.filter(f => !filledFields.has(f));
              if (missingFields.length === 0) return [];
              return [
                `${label}: project "${item.project.title}" is missing required fields: ${missingFields.join(', ')}.`
              ];
            };

            // Filling in the "Development"/"Projects" fields on a freshly opened PR
            // (or the project fields of its linked issue) is a manual step that
            // happens right after opening it, but doesn't fire any pull_request
            // event itself — so retry for a bit before failing, to
            // avoid a spurious red check on a PR whose fields are set moments later.
            const maxAttempts = 5;
            const delayMs = 30_000;
            let lastErrors = [];

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const result = await github.graphql(query, { owner, repo, number: prNumber });
              const pr = result.repository.pullRequest;

              const linkedIssues = pr.closingIssuesReferences.nodes;
              const projectItems = pr.projectItems.nodes;

              lastErrors = [];

              if (linkedIssues.length === 0 && projectItems.length === 0) {
                lastErrors.push(
                  'This pull request must have either the "Development" field (a linked issue) or be added to a "Projects" board.'
                );
              }

              for (const item of projectItems) {
                lastErrors.push(...checkProjectItem(item, 'Pull request'));
              }

              for (const issue of linkedIssues) {
                const label = `Linked issue ${issue.repository.nameWithOwner}#${issue.number}`;
                const issueItems = issue.projectItems.nodes;
                if (issueItems.length === 0) {
                  lastErrors.push(`${label} must be added to a "Projects" board.`);
                }
                for (const item of issueItems) {
                  lastErrors.push(...checkProjectItem(item, label));
                }
              }

              if (lastErrors.length === 0) {
                return;
              }

              if (attempt < maxAttempts) {
                core.info(`Attempt ${attempt}/${maxAttempts} failed, retrying in ${delayMs / 1000}s: ${lastErrors.join(' | ')}`);
                await sleep(delayMs);
              }
            }

            core.setFailed(lastErrors.join('\n'));
