name: Generate changelog PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Prepend the unreleased changes to the changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git_cliff_full
        with:
          config: src/web/cliff.toml
          args: --verbose --unreleased --bump --prepend src/web/CHANGELOG.md

      - name: Generate latest changes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git_cliff_latest
        with:
          config: src/web/cliff.toml
          args: --verbose --latest --bump --unreleased

      - name: Create Pull Request
        if: steps.git_cliff_full.outputs.version != 'null'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          add-paths: |
            src/web/CHANGELOG.md
          base: main
          commit-message: "chore(release): update CHANGELOG.md for ${{ steps.git_cliff_full.outputs.version }}"
          signoff: true
          sign-commits: true
          branch: chore/next-release-changelog
          delete-branch: true
          title: "chore(release): update CHANGELOG.md for ${{ steps.git_cliff_full.outputs.version }}"
          body: ${{ steps.git_cliff_latest.outputs.content }}
          labels: |
            pending-release
