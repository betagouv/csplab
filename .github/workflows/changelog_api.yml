name: Changelog API

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

jobs:
  check-changelog-api:
    # Skipped in the merge queue: the check already ran on the pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The checkout is refs/pull/<n>/merge, a single merge commit of the whole pull
      # request into its base branch (main or not, for stacked pull requests):
      # - HEAD^1 is the tip of the base branch, HEAD^2 the last commit of the pull request;
      # - HEAD^1..HEAD holds every change of the pull request, whatever its number of
      #   commits, and nothing that landed on the base branch meanwhile.
      # fetch-depth: 2 fetches the merge commit and its parents, enough for the script.
      # A pull request in conflict with its base has no merge commit: the workflow runs
      # again once the conflict is solved.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-mise
      - name: Check changelog_api.md follows the public API changes
        run: uv run .github/scripts/check_changelog_api.py HEAD^1
