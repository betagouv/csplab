name: Lib Version Bump Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      libs: ${{ steps.filter.outputs.libs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            libs:
              - "libs/**"

  check-version-bump:
    needs: check-changes
    if: needs.check-changes.outputs.libs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check that every changed lib version was bumped
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          STATUS=0
          for LIB in ddd referentiel scaleway_secrets; do
            LIB_PATH="libs/$LIB"

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$LIB_PATH")
            if [ -z "$CHANGED_FILES" ]; then
              echo "No changes in $LIB_PATH, skipping."
              continue
            fi

            BASE_VERSION=$(git show "$BASE_SHA:$LIB_PATH/pyproject.toml" | grep -m1 '^version' | sed -E 's/version *= *"(.*)"/\1/')
            HEAD_VERSION=$(git show "$HEAD_SHA:$LIB_PATH/pyproject.toml" | grep -m1 '^version' | sed -E 's/version *= *"(.*)"/\1/')

            echo "$LIB base version: $BASE_VERSION"
            echo "$LIB head version: $HEAD_VERSION"

            if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
              echo "::error::Files changed in $LIB_PATH but the version in $LIB_PATH/pyproject.toml was not bumped (still $HEAD_VERSION)."
              STATUS=1
            fi
          done
          exit $STATUS
