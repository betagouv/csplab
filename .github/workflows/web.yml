name: Web

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            relevant:
              - "src/web/**"
              - "libs/**"
              - "mise.toml"
              - "mise.ci.toml"
              - ".github/workflows/web.yml"
              - ".github/actions/**"

  build-web:
    needs: check-changes
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mise
      - name: Build frontend
        run: mise run front:build

  lint-web:
    needs: [check-changes, build-web]
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mise
      - name: Lint with Ruff
        run: mise run web:lint:ruff
      - name: Lint with MyPy
        run: mise run web:lint:mypy
      - name: Lint web templates with djlint
        run: mise run web:lint:djlint
      - name: Lint candidate JS
        run: mise run web:lint:candidate-js
      - name: Lint candidate styles
        run: mise run web:lint:styles
      - name: Lint frontend
        run: mise run front:lint
      - name: TypeScript check
        run: mise run front:typecheck
      - name: Test frontend with coverage
        run: mise run front:test -- --coverage
      - name: Check no migrations are missing
        run: mise run web:lint:migrations
      - name: Lint schema
        run: mise run web:lint:schema
      - name: Check internal schema and frontend types are up to date
        run: |
          mise run web:lint:types || \
            (echo "::error::Le schéma OpenAPI interne ou les types TypeScript ne sont pas synchronisés avec le schéma OpenAPI. Lancez 'mise run front:types' et committez." && exit 1)

  test-web:
    needs: [check-changes, build-web]
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: web
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
          TEST: true
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mise
      - name: Wait for Qdrant to be ready
        run: |
          echo "Waiting for Qdrant to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:6333 > /dev/null 2>&1; then
              echo "✅ Qdrant is ready"
              break
            fi
            echo "⏳ Waiting for Qdrant... (attempt $i/30)"
            sleep 2
          done
      - name: Setup Qdrant collections
        run: mise run web:qdrant:init
      - name: Test with pytest
        run: mise run web:test
      - name: Get Playwright version
        id: playwright-version
        working-directory: ./src/web
        run: echo "version=$(uv run playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./src/web
        run: uv run playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./src/web
        run: uv run playwright install-deps chromium
      - name: Test e2e
        run: mise run web:test:e2e

  deploy-web:
    needs: [check-changes, lint-web, test-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: betagouv
          SENTRY_PROJECT: csplab-web
          SENTRY_URL: https://sentry.incubateur.net
        with:
          environment: production
      - uses: ./.github/actions/scalingo-deploy
        with:
          branch: main-web
