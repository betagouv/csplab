name: Web

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            relevant:
              - "src/web/**"
              - "libs/**"
              - "mise.toml"
              - "mise.ci.toml"
              - "mise.lock"
              - ".github/workflows/web.yml"
              - ".github/actions/**"

  lint-web:
    needs: check-changes
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-mise
      - name: Install web dependencies
        run: mise run web:install
      - name: Lint with Ruff
        run: mise run web:lint:ruff
      - name: Lint with MyPy
        run: mise run web:lint:mypy
      - name: Lint web templates with djlint
        run: mise run web:lint:djlint
      - name: Lint candidate JS
        run: mise run web:lint:candidate-js
      - name: Lint candidate styles
        run: mise run web:lint:styles
      - name: Build frontend
        run: mise run front:build
      - name: Lint frontend
        run: mise run front:lint
      - name: TypeScript check
        run: mise run front:typecheck
      - name: Test frontend with coverage
        run: mise run front:test -- --coverage
      - name: Check no migrations are missing
        run: mise run web:lint:migrations
      - name: Lint schema
        run: mise run web:lint:schema
      - name: Check internal schema and frontend types are up to date
        run: |
          mise run web:lint:types || \
            (echo "::error::Le schéma OpenAPI interne ou les types TypeScript ne sont pas synchronisés avec le schéma OpenAPI. Lancez 'mise run front:types' et committez." && exit 1)

  changelog-api:
    needs: check-changes
    if: github.event_name != 'push' && needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # On pull_request, HEAD^1 is the base branch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-mise
      # A separate step: mise resolves the .venv before its dependencies create it.
      - name: Install web Python dependencies
        run: mise run web:install:py
      - name: Check the API changelog fragments
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            # head_ref looks like refs/heads/gh-readonly-queue/main/pr-123-<sha>
            PR_NUMBER=$(echo "$MERGE_GROUP_HEAD_REF" | sed -E 's#.*/pr-([0-9]+)-.*#\1#')
            git fetch --depth=1 origin "$MERGE_GROUP_BASE_SHA"
            set -- --base "$MERGE_GROUP_BASE_SHA" --merge-queue
          else
            set -- --base HEAD^1 --pr "$PR_NUMBER"
          fi
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '.labels[].name' | grep -qx changelog-api-migration; then
            set -- "$@" --exempte
          fi
          mise run web:lint:changelog-api -- "$@"

  test-web:
    needs: check-changes
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:18
        env:
          POSTGRES_DB: web
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
          TEST: true
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      qdrant:
        image: qdrant/qdrant:v1.20
        ports:
          - 6333:6333
      redis:
        image: redis:8
        ports:
          - 6379:6379
      rustfs:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
        ports:
          - 9000:9000
          - 9001:9001
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-mise
      - name: Install web dependencies
        run: mise run web:install
      - name: Wait for Qdrant to be ready
        run: |
          echo "Waiting for Qdrant to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:6333 > /dev/null 2>&1; then
              echo "✅ Qdrant is ready"
              break
            fi
            echo "⏳ Waiting for Qdrant... (attempt $i/30)"
            sleep 2
          done
      - name: Setup Qdrant collections
        run: mise run web:qdrant:init
      - name: Setup S3 bucket
        run: mise run web:s3:init
      - name: Test with pytest
        run: mise run web:test
      - name: Get Playwright version
        id: playwright-version
        working-directory: ./src/web
        run: echo "version=$(uv run playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./src/web
        run: uv run playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./src/web
        run: uv run playwright install-deps chromium
      - name: Test e2e
        run: mise run web:test:e2e

  deploy-web:
    needs: [check-changes, lint-web, test-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/sentry-release
        with:
          project: csplab-web
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - uses: ./.github/actions/scalingo-deploy
        with:
          branch: main-web
