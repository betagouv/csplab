name: Ingestion

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            relevant:
              - "src/ingestion/**"
              - "mise.toml"
              - "mise.ci.toml"
              - "mise.lock"
              - ".github/workflows/ingestion.yml"
              - ".github/actions/**"

  build-ingestion:
    needs: check-changes
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-mise
      - name: Install ingestion dependencies
        run: mise run ingestion:install

  lint-ingestion:
    needs: [check-changes, build-ingestion]
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:18
        env:
          POSTGRES_DB: ingestion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-mise
      - name: Install ingestion dependencies
        run: mise run ingestion:install
      - name: Lint with Ruff
        run: mise run ingestion:lint:ruff
      - name: Lint with MyPy
        run: mise run ingestion:lint:mypy
      - name: Check no migrations are missing
        run: mise run ingestion:lint:migrations

  test-ingestion:
    needs: [check-changes, build-ingestion]
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:18
        env:
          POSTGRES_DB: ingestion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-mise
      - name: Install ingestion dependencies
        run: mise run ingestion:install
      - name: Test with pytest
        run: mise run ingestion:test -- --cov=. --cov-report=term-missing --cov-fail-under=95

  deploy-ingestion:
    needs: [check-changes, lint-ingestion, test-ingestion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time per service; a newer pending deploy replaces the older pending one
    concurrency:
      group: deploy-ingestion
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/sentry-release
        with:
          project: csplab-ingestion
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - uses: ./.github/actions/scalingo-deploy
        with:
          branch: main-ingestion
