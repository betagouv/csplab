name: Ingestion

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            relevant:
              - "src/ingestion/**"
              - "mise.toml"
              - "mise.ci.toml"
              - ".github/workflows/ingestion.yml"
              - ".github/actions/**"

  build-ingestion:
    needs: check-changes
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mise
      - name: Install ingestion dependencies
        run: mise run ingestion:install

  lint-ingestion:
    needs: [check-changes, build-ingestion]
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:17
        env:
          POSTGRES_DB: ingestion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mise
      - name: Install ingestion dependencies
        run: mise run ingestion:install
      - name: Lint with Ruff
        run: mise run ingestion:lint:ruff
      - name: Lint with MyPy
        run: mise run ingestion:lint:mypy
      - name: Check no migrations are missing
        run: mise run ingestion:lint:migrations

  test-ingestion:
    needs: [check-changes, build-ingestion]
    if: github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    services:
      postgresql:
        image: postgres:17
        env:
          POSTGRES_DB: ingestion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-mise
      - name: Install ingestion dependencies
        run: mise run ingestion:install
      - name: Test with pytest
        run: mise run ingestion:test -- --cov=. --cov-report=term-missing --cov-fail-under=95

  deploy-ingestion:
    needs: [check-changes, lint-ingestion, test-ingestion]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: betagouv
          SENTRY_PROJECT: csplab-ingestion
          SENTRY_URL: https://sentry.incubateur.net
        with:
          environment: production
      - uses: ./.github/actions/scalingo-deploy
        with:
          branch: main-ingestion
          scaleway-secret-path: /ingestion/prod
          scalingo-app: csplab-ingestion
          scalingo-api-token: ${{ secrets.SCALINGO_API_TOKEN }}
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
          scw-default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          scw-default-region: ${{ secrets.SCW_DEFAULT_REGION }}
