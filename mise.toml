# Task naming and layout: docs/mise.md. Personal overrides go to mise.local.toml.

min_version = "2026.8.14"
monorepo_root = true
redactions = ["*SECRET*", "*_KEY", "*PASSWORD*", "*TOKEN*", "*CREDENTIALS*", "DATABASE_URL", "*_DATABASE_URL"]

[monorepo]
config_roots = [
  "src/web",
  "src/web/presentation/frontend",
  "src/ocr",
  "src/ingestion",
  "src/notebook",
  "libs/ddd",
  "libs/referentiel",
  "libs/scaleway_secrets",
  "dev",
]

[tools]
node = "24"
uv = "0.9"

[settings]
# corepack shims let pnpm resolve its version from packageManager (single source of truth)
node.corepack = true

[tasks."secrets:check"]
description = "Check the Scaleway access and list the secret names of every service"
depends = ["//src/web:secrets:check", "//src/ingestion:secrets:check", "//src/ocr:secrets:check"]

[tasks.default]
description = "Show the everyday commands"
hide = true
quiet = true
run = """
cat <<'EOF'
Everyday commands (mise tasks --all for the full list):

  mise run dev                          Django + Vite HMR
  mise run web:manage -- shell          any manage.py command
  mise run web:test -- -k <pattern>     targeted backend tests
  mise run web:migration                makemigrations, then web:migrate
  mise run front:check                  frontend lint + typecheck + tests
  mise run lint                         lint everything, in parallel
  mise run check                        everything the CI checks
  mise run web:seed                     demo dataset (idempotent)
  mise run web:db:reset                 fresh web database
  mise run onboard                      first-time machine setup

Tasks run from anywhere; docs/mise.md explains naming and aliases.
EOF
"""

[tasks.install]
description = "Install dependencies of every subproject"
depends = ["//...:install"]

[tasks.lint]
description = "Lint the whole repo in parallel"
depends = ["//...:lint", "//...:typecheck"]

[tasks."lint:fix"]
description = "Lint the whole repo with autofix"
depends = ["//...:lint:fix"]

[tasks.test]
description = "Run every test suite (e2e excluded)"
# within `check`, wait for the lint phase instead of competing with it for CPU
wait_for = ["lint"]
depends = ["//...:test"]

[tasks."test:cov"]
description = "Run tests with HTML coverage reports (web, ocr, ingestion)"
depends = ["//...:test:cov"]

[tasks.check]
description = "Everything the CI checks: lint + tests"
depends = ["lint", "test"]

[tasks.dev]
description = "ATS dev stack: Django + Vite HMR"
depends = ["//src/web:dev", "//src/web/presentation/frontend:dev"]

[tasks."docker:up"]
description = "Check the docker daemon is reachable"
hide = true
run = "docker info >/dev/null 2>&1 || { echo 'Docker unreachable, start your engine (Colima, Docker Desktop, OrbStack…)'; exit 1; }"

[tasks."services:postgres"]
description = "Start postgres"
depends = ["docker:up"]
run = "set -a && . env.d/postgresql && docker compose up -d --wait --remove-orphans postgresql"

[tasks."services:redis"]
description = "Start redis"
depends = ["docker:up"]
run = "set -a && . env.d/redis && docker compose up -d --wait --remove-orphans redis"

[tasks."services:qdrant"]
description = "Start qdrant (vector search)"
depends = ["docker:up"]
run = "docker compose up -d --wait --remove-orphans qdrant"

[tasks.services]
description = "Start all docker services"
depends = ["services:postgres", "services:redis", "services:qdrant"]

[tasks.setup]
description = "Create missing env files from the examples (never overwrites)"
run = """
for f in web ocr notebook ingestion; do cp -n src/$f/.envrc.sample src/$f/.envrc || true; done
for f in web ocr notebook ingestion postgresql redis; do cp -n env.d/$f-example env.d/$f || true; done
for f in web ocr notebook ingestion; do (cd src/$f && direnv allow) || true; done
echo "Env files in place (existing files untouched)."
"""

[tasks."setup:force"]
description = "Reset env files from the examples (overwrites)"
confirm = { message = "Overwrite your env.d/* and .envrc files with the examples?", default = "no" }
run = """
for f in web ocr notebook ingestion; do cp src/$f/.envrc.sample src/$f/.envrc; done
for f in web ocr notebook ingestion postgresql redis; do cp env.d/$f-example env.d/$f; done
for f in web ocr notebook ingestion; do (cd src/$f && direnv allow) || true; done
echo "Env files reset from the examples."
"""

[tasks.git-hooks]
description = "Install the git hooks (pre-commit, commit-msg)"
run = """
mkdir -p .pre-commit-cache
cp bin/git-pre-commit-hook .git/hooks/pre-commit
cp bin/git-commit-msg-hook .git/hooks/commit-msg
"""

[tasks.bootstrap]
description = "Prepare the full dev environment (services, dependencies, migrations, superuser)"
depends = [
  "services",
  "install",
  "//src/web:qdrant:init",
  "//src/web:superuser",
  "//src/web:install:playwright",
  "//src/ingestion:migrate",
  "//src/ingestion:db:create-test",
  "//src/notebook:jupytext:ipynb",
]

[tasks.onboard]
description = "First-time setup: env files, git hooks, then full bootstrap"
depends = ["setup", "git-hooks"]
# fresh mise invocation so the env files setup just created are loaded
run = "mise run bootstrap"

[tasks."onboard:reset"]
description = "Reset a dev machine: env files from the examples, docker volumes wiped, then full bootstrap"
confirm = { message = "Reset env.d/* and .envrc AND remove docker volumes (local databases lost), then reinstall everything?", default = "no" }
# single confirm here: the inner destructive tasks are pre-confirmed via MISE_YES
run = [
  "MISE_YES=1 mise run setup:force",
  "mise run git-hooks",
  "MISE_YES=1 mise run bootstrap:reset",
]

[tasks."bootstrap:reset"]
description = "Start from scratch: remove docker containers and volumes, then bootstrap"
confirm = { message = "Remove the docker volumes (local databases will be lost), then reinstall everything?", default = "no" }
# cannot use depends_post: mise starts post-deps before the confirm is answered
run = ["docker compose down -v", "mise run bootstrap"]
