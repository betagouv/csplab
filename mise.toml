[tools]
node = "24"
uv = "0.9"

# ── Frontend (node seul, aucun service back requis) ──────────────────────────
[tasks.sb]
description = "Storybook front"
dir = "src/web/presentation/frontend"
run = "pnpm run storybook"

[tasks."sb:build"]
description = "Build statique du Storybook"
dir = "src/web/presentation/frontend"
run = "pnpm run build-storybook"

[tasks."front:dev"]
description = "Vite HMR front"
dir = "src/web/presentation/frontend"
run = "pnpm run dev"

[tasks."front:lint"]
description = "Lint du frontend (eslint)"
dir = "src/web/presentation/frontend"
run = "pnpm run lint"

[tasks."front:lint:fix"]
description = "Lint du frontend avec auto-correction"
dir = "src/web/presentation/frontend"
run = "pnpm run lint:fix"

[tasks."front:typecheck"]
description = "Typecheck du frontend (vue-tsc)"
dir = "src/web/presentation/frontend"
run = "pnpm run typecheck"

[tasks."front:test"]
description = "Tests du frontend (vitest)"
dir = "src/web/presentation/frontend"
run = "pnpm run test:run"

[tasks."front:build"]
description = "Build de prod du frontend, incrémental (skip si les sources n'ont pas changé)"
dir = "src/web/presentation/frontend"
sources = ["src/**/*", "package.json", "tsconfig*.json", "vite.config.*", "../../pnpm-lock.yaml"]
outputs = ["../static/frontend/manifest.json"]
run = "pnpm run build"

[tasks."front:check"]
description = "Front : lint + typecheck + tests en parallèle"
depends = ["front:lint", "front:typecheck", "front:test"]

[tasks."front:types"]
description = "Régénère le schéma OpenAPI interne et les types TypeScript du front"
dir = "src/web"
run = [
  "DJANGO_SETTINGS_MODULE=config.settings.schema_internal direnv exec . python manage.py spectacular --file presentation/static/api/internal-schema.yaml --validate",
  "pnpm --filter csplab-frontend generate-types",
]

# ── Install & migrations ─────────────────────────────────────────────────────
[tasks."install:py"]
description = "Dépendances Python du back (uv : web + ddd + referentiel)"
run = "make build-web"

[tasks."install:js"]
description = "Dépendances frontend (pnpm)"
dir = "src/web"
run = "pnpm install"

[tasks.install]
description = "Installe les dépendances ATS (Python + frontend)"
depends = ["install:py", "install:js"]

# ── Services & app (Docker + Django) ─────────────────────────────────────────
[tasks."docker:up"]
description = "Vérifie que Docker est joignable (démarrez votre moteur au besoin)"
run = "docker info >/dev/null 2>&1 || { echo 'Docker injoignable, démarrez votre moteur (Colima, Docker Desktop, OrbStack…)'; exit 1; }"

[tasks."services:ats"]
description = "Démarre postgres (suffit pour le dev ATS)"
depends = ["docker:up"]
run = "make run-postgres"

[tasks."services:cv"]
description = "Postgres + Redis + Qdrant (recherche vectorielle, analyse de CV, ingestion)"
depends = ["docker:up"]
run = ["make run-postgres", "make run-redis", "make run-qdrant"]

[tasks."back:ats"]
description = "Back Django"
depends = ["services:ats"]
run = "make run-web"

[tasks."back:cv"]
description = "Back Django + sass watch (dev candidat/CV : styles SCSS DSFR)"
depends = ["services:cv"]
run = "make dev"

[tasks.migrate]
description = "Applique les migrations Django"
depends = ["services:ats"]
run = "make migrate"

[tasks."test:e2e"]
description = "E2e ATS en vrai navigateur (rebuild le front seulement si nécessaire)"
depends = ["front:build", "services:ats"]
dir = "src/web"
run = "direnv exec . pytest -m e2e --no-cov"

[tasks."db:restore"]
description = "Restaure la base web depuis un dump Scalingo (dernier dump de dumps/ par défaut)"
confirm = "Écraser la base web locale ?"
run = "make restore-web-db"

[tasks."open:ats"]
description = "Ouvre http://localhost:8000/ats/ quand le back répond"
# depends parallèles : on sonde le back avant d'ouvrir. Opener portable, non-fatal.
run = "URL=http://localhost:8000/ats/; for _ in $(seq 1 120); do curl -s -o /dev/null \"$URL\" && break; sleep 0.5; done; (open \"$URL\" || xdg-open \"$URL\") >/dev/null 2>&1 || true"

[tasks.dev]
description = "Stack complète pour dev le front de l'ATS"
depends = ["back:ats", "front:dev", "open:ats"]

[tasks.emulate-prod]
description = "Émule la prod : build front + collectstatic + runserver :8001"
run = "cd src/web && (cd presentation/frontend && corepack pnpm exec vite build --mode production) && DJANGO_SETTINGS_MODULE=config.settings.base direnv exec . python manage.py collectstatic --noinput --clear && DJANGO_SETTINGS_MODULE=config.settings.base direnv exec . env WEB_ALLOWED_HOSTS=localhost,127.0.0.1 python manage.py runserver 8001 --noreload"
