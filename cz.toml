[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
message_template = "{{change_type}}({{scope}}): {{subject}}{% if body %}\n\n{{body}}{% endif %}{% if footer %}\n\n{{footer}}{% endif %}"
example = "feat(recruteur): ajoute une nouvelle fonctionnalité"
schema = "<type>(<scope>): <subject>"
# The scope list is duplicated in the "scope" question below: keep both in sync.
schema_pattern = "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\\((recruteur|candidatures|messages|identite|ingestion|referentiel|ocr|notebook|tooling|release)\\)!?: [A-zÀ-ú].{1,75}(\\n\\n[\\s\\S]*)?$"

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
message = "Select the type of change:"
choices = [
    {value = "feat", name = "feat: introduce new features"},
    {value = "fix", name = "fix: fix a bug"},
    {value = "docs", name = "docs: add/update documentation"},
    {value = "style", name = "style: improve structure / format of the code"},
    {value = "refactor", name = "refactor: refactor code"},
    {value = "perf", name = "perf: improve performance"},
    {value = "test", name = "test: add/update/pass tests"},
    {value = "build", name = "build: add/update build system or dependencies"},
    {value = "ci", name = "ci: add/update CI build system"},
    {value = "chore", name = "chore: miscellaneous changes (config, assets, WIP...)"},
    {value = "revert", name = "revert: revert a previous commit"}
]

# Same list as schema_pattern above.
[[tool.commitizen.customize.questions]]
type = "list"
name = "scope"
message = "Select the scope:"
choices = [
    {value = "recruteur", name = "recruteur"},
    {value = "candidatures", name = "candidatures"},
    {value = "messages", name = "messages"},
    {value = "identite", name = "identite"},
    {value = "ingestion", name = "ingestion"},
    {value = "referentiel", name = "referentiel"},
    {value = "ocr", name = "ocr"},
    {value = "notebook", name = "notebook"},
    {value = "tooling", name = "tooling"},
    {value = "release", name = "release"}
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "subject"
message = "Subject (imperative, lowercase, no dot):"

[[tool.commitizen.customize.questions]]
type = "input"
name = "body"
message = "Body (optional, explain WHY):"

[[tool.commitizen.customize.questions]]
type = "input"
name = "footer"
message = "Footer (optional, breaking changes, issues):"
