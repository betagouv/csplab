[env]
_.file = "../../env.d/ocr"
_.python.venv = { path = ".venv" }
_.source = { path = "bin/inject_scaleway_env.sh", tools = true }

[tasks.install]
alias = "ocr:install"
description = "Install Python dependencies (uv sync)"
sources = ["pyproject.toml", "uv.lock"]
outputs = { auto = true }
run = "uv sync --group dev --locked"

[tasks."secrets:check"]
alias = "ocr:secrets:check"
description = "Check the Scaleway access and list the secret names of this service"
run = "uv run -q --project ../../libs/scaleway_secrets python -m scaleway_secrets.fetch ocr --names"

[tasks.dev]
alias = "ocr:dev"
description = "OCR API (uvicorn :8001)"
depends = ["install"]
shell = "bash -c"
run = """
uvicorn api.main:app --reload --port=8001
"""

[tasks.test]
alias = "ocr:test"
description = "OCR tests"
depends = ["install"]
env = { _.file = "env.test" }
run = "pytest --no-cov"

[tasks."test:cov"]
alias = "ocr:test:cov"
description = "OCR tests with an HTML coverage report"
depends = ["install"]
env = { _.file = "env.test" }
run = [
  "pytest --cov=. --cov-report=html:tests/cov_html --cov-report=term-missing",
  "open tests/cov_html/index.html",
]

[tasks.lint]
alias = "ocr:lint"
description = "OCR lint: ruff + mypy in parallel"
depends = ["lint:ruff", "lint:mypy"]

[tasks."lint:ruff"]
alias = "ocr:lint:ruff"
description = "Lint Python (ruff check + format)"
depends = ["install"]
run = ["ruff check .", "ruff format --check ."]

[tasks."lint:mypy"]
alias = "ocr:lint:mypy"
description = "Type-check Python (mypy)"
depends = ["install"]
run = "mypy ."

[tasks."lint:fix"]
alias = "ocr:lint:fix"
description = "OCR lint with autofix (ruff)"
run = ["ruff check --fix .", "ruff format ."]
