<div class="fr-notice fr-notice--alert csplab-notice">
    <div class="fr-container">
        <div class="fr-notice__body">
            <p>
                <span class="fr-notice__title">Impossible d'accéder à l'ATS</span>
                <span class="fr-notice__desc">Aucun compte n'est associé au courriel ProConnect utilisé.</span>
                <a class="fr-notice__link"
                   href="{% url 'identite:proconnect_login' %}{% if next %}?next={{ next|urlencode:'' }}{% endif %}">Essayer avec un autre courriel</a>
            </p>
            <button class="fr-btn--close fr-btn" title="Masquer le message">Masquer le message</button>
        </div>
    </div>
</div>
