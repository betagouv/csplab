      description: |2

        # API de consultation des offres d'emploi de la Fonction Publique

        Cette API retourne la liste des offres correspondant à une recherche selon les
        critères suivants :

        - `actif` — candidature active / archivée
        - `categorie` — une ou plusieurs catégories (ex. `A,B`)
        - `versant` — un ou plusieurs versants (ex. `FPE,FPT`)
        - `type_contrat` — un ou plusieurs types de contrat (ex. `TITULAIRE_CONTRACTUEL`)
        - `niveau_experience` — un ou plusieurs niveaux d'expérience (ex. `DEBUTANT,EXPERT`)
        - `region` — un ou plusieurs codes région (ex. `11,84`)
        - `departement` — un ou plusieurs codes département (ex. `75,69`)
        - `pays` — un ou plusieurs codes pays alpha-3 (ex. `FRA,BEL`)
        - `zone` — une ou plusieurs zones géographiques (ex. `EUROPE,ASIE`)
        - `domaine` — un ou plusieurs codes de domaine fonctionnel (ex. `NUM,ACH`)
        - `organisme` — un ou plusieurs noms d'organisme (nom exact). Répéter le
          paramètre pour filtrer sur plusieurs organismes (ex.
          `?organisme=Foo&organisme=Bar`), ne pas séparer les valeurs par une
          virgule, le nom d'un organisme pouvant en contenir une.
        - `date_publication` — nombre de jours négatif pour ne retourner que les
          offres publiées au cours des N derniers jours (ex. `-7`)
        - filtre géographique par rayon autour d'un point, les trois paramètres
          doivent être fournis ensemble :
          - `latitude` — latitude du point en degrés décimaux (entre -90 et 90)
          - `longitude` — longitude du point en degrés décimaux (entre -180 et 180)
          - `radius` — rayon de recherche en kilomètres (entier positif)
        - `mots_cles` — recherche plein texte (en français) sur le titre,
          l'intitulé long, la mission, le profil, l'organisme, l'employeur et les
          compléments de l'offre

        Les filtres à valeurs multiples acceptent une liste de valeurs séparées par une
        virgule. Une valeur invalide pour l'un de ces filtres renvoie une erreur `400`.


        Cette API est à l'usage exclusif des personnes autorisées.

        # Permissions

        L'utilisation de cette API nécessite un token d'autorisation spécifique à chaque
        utilisateur.

        # Limitations

        L'interrogation de cette API est limitée à 120 appels par minute et par utilisateur.
