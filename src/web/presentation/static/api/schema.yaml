        name: area
        schema:
          type: array
          items:
            enum:
            - AFRIQUE
            - EUROPE
            - ASIE
            - AMERIQUE
            - OCEANIE
            - ANTARTIQUE
            - MOYEN_ORIENT_AFRIQUE_DU_NORD
            type: string
            description: |-
              * `AFRIQUE` - AF
              * `EUROPE` - EU
              * `ASIE` - AS
              * `AMERIQUE` - AM
              * `OCEANIE` - OC
              * `ANTARTIQUE` - AN
              * `MOYEN_ORIENT_AFRIQUE_DU_NORD` - MO
      - in: query
        name: category
        schema:
          type: array
          items:
            enum:
            - APLUS
            - A
            - B
            - C
            type: string
            description: |-
              * `APLUS` - APLUS
              * `A` - A
              * `B` - B
              * `C` - C
      - in: query
        name: contractType
