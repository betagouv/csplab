openapi: 3.0.3
info:
  title: CSPLab API
  version: 0.0.1
  description: API for CSPLab
paths:
  /api/fake-ts/offers/getoffer:
    get:
      operationId: fake_ts_offers_getoffer_retrieve
      description: Simule l'API Talentsoft `offers/getoffer`.
      summary: Détail d'une offre (format Talentsoft)
      parameters:
      - in: query
        name: reference
        schema:
          type: string
          minLength: 1
        description: La référence de l'offre.
        required: true
      tags:
      - fake-ts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FakeTsOfferDetail'
          description: ''
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Nombre maximal d'appels autorisés sur la fenêtre courante.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Nombre d'appels restants sur la fenêtre courante.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Timestamp Unix (secondes) auquel la fenêtre courante se
                réinitialise.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: ''
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Nombre maximal d'appels autorisés sur la fenêtre courante.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Nombre d'appels restants sur la fenêtre courante.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Timestamp Unix (secondes) auquel la fenêtre courante se
                réinitialise.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: ''
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Nombre maximal d'appels autorisés sur la fenêtre courante.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Nombre d'appels restants sur la fenêtre courante.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Timestamp Unix (secondes) auquel la fenêtre courante se
                réinitialise.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: ''
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Nombre maximal d'appels autorisés sur la fenêtre courante.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Nombre d'appels restants sur la fenêtre courante.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: Timestamp Unix (secondes) auquel la fenêtre courante se
                réinitialise.
  /api/fake-ts/offersummaries:
